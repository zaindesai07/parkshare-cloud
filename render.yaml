services:
  - type: web
    name: parkshare-cloud
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: parkshare-db
          property: connectionString

databases:
  - name: parkshare-db
    plan: free
    databaseName: parkshare
    user: parkshare_user
    region: oregon
